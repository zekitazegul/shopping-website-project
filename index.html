<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#164c3c"><title>Shopping Website Project</title><link rel="stylesheet" href="./src/style.css"></head>
<body><div class="construction-notice" role="status"><span aria-hidden="true">⚒</span><span data-i18n="construction">Deze website is nog in ontwikkeling. We blijven de website verbeteren.</span></div><header><a class="brand" href="./"><span class="brand-icon">s.</span><span>shopping<span class="brand-small">website project</span></span></a><div class="header-actions"><button id="favorites" aria-pressed="false"></button><label><span class="sr-only" id="languageLabel"></span><select id="language"><option value="nl">Nederlands</option><option value="en">English</option><option value="tr">Türkçe</option></select></label></div></header>
<main><section class="hero"><div><p class="eyebrow" data-i18n="eyebrow"></p><h1 data-i18n="headline"></h1><p class="hero-copy" data-i18n="intro"></p><a class="hero-link" href="#browse" data-i18n="explore"></a></div><div class="hero-art" aria-hidden="true"><span class="art-orbit"></span><span class="art-chair">🪑</span><span class="art-tag">€ 45</span><span class="art-note">NL ↗</span><span class="art-circle"></span></div></section>
<div class="sample-note"><span class="status-dot"></span><span data-i18n="demo"></span></div>
<section id="browse"><div class="section-heading"><div><p class="eyebrow" data-i18n="discover"></p><h2 data-i18n="listings"></h2></div><button class="text-button" id="reset" data-i18n="reset"></button></div>
<form id="search-form" class="searchbar" role="search"><label class="search-field"><span aria-hidden="true">⌕</span><span class="sr-only" data-i18n="search"></span><input id="search" type="search" autocomplete="off"></label><button type="submit" class="primary" data-i18n="searchButton"></button></form>
<div id="categories" class="categories" role="group"></div><div class="market-layout"><aside><div class="filter-heading"><h3 data-i18n="filters"></h3><span aria-hidden="true">☷</span></div><label class="filter-label" for="country" data-i18n="country"></label><select id="country"></select><p class="filter-help" data-i18n="countryHelp"></p><label class="check-label"><input type="checkbox" id="nl-only"><span data-i18n="nlOnly"></span></label><hr><span class="filter-label" data-i18n="price"></span><div class="price-fields"><label><span data-i18n="min"></span><input id="min" type="number" min="0" inputmode="decimal" placeholder="€ 0"></label><label><span data-i18n="max"></span><input id="max" type="number" min="0" inputmode="decimal" placeholder="€ ∞"></label></div><label class="filter-label" for="condition" data-i18n="condition"></label><select id="condition"></select></aside>
<div class="results"><div class="results-toolbar"><p id="count" aria-live="polite"></p><label class="sort-label"><span class="sr-only" data-i18n="sort"></span><select id="sort"></select></label></div><div id="grid" class="grid"></div><div id="empty" class="empty" hidden><span aria-hidden="true">⌕</span><h3 data-i18n="empty"></h3><p data-i18n="emptyHelp"></p><button class="primary" id="empty-reset" data-i18n="reset"></button></div></div></div></section></main><footer><span>shopping website project · 0.1.0</span><span data-i18n="footer"></span></footer>
<dialog id="detail"><button id="close-detail" class="close-button" aria-label="Close">×</button><div id="detail-content"></div></dialog><script type="module" src="./src/app.js"></script></body></html>
