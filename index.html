<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#164c3c"><title>Shopping Website Project</title><link rel="stylesheet" href="./src/style.css"></head>
<body><div class="construction-notice" role="status"><span aria-hidden="true">⚒</span><span data-i18n="construction">Deze website is nog in ontwikkeling. We blijven de website verbeteren.</span></div><header><a class="brand" href="./"><span class="brand-icon">s.</span><span>shopping<span class="brand-small">website project</span></span></a><div class="header-actions"><button id="message-inbox" type="button" data-i18n="messageInbox" hidden></button><button id="account-button" data-i18n="authSignIn"></button><button id="favorites" aria-pressed="false"></button><label><span class="sr-only" id="languageLabel"></span><select id="language"><option value="nl">Nederlands</option><option value="en">English</option><option value="tr">Türkçe</option><option value="de">Deutsch</option><option value="fr">Français</option><option value="it">Italiano</option><option value="es">Español</option><option value="pl">Polski</option><option value="pt">Português</option></select></label></div></header>
<main><div id="session-banner" class="session-banner" role="status" hidden><span class="session-state"><span aria-hidden="true">✓</span> <strong data-i18n="authSignedIn"></strong></span><span id="session-email"></span><span id="session-admin-badge" class="session-badge" data-i18n="authAdminBadge" hidden></span><div class="session-actions"><button type="button" id="session-admin-link" class="text-button" data-i18n="authAdminTitle" hidden></button><button type="button" id="session-logout" class="text-button" data-i18n="authLogout"></button></div></div><section class="hero"><div><p class="eyebrow" data-i18n="eyebrow"></p><h1 data-i18n="headline"></h1><p class="hero-copy" data-i18n="intro"></p><a class="hero-link" href="#browse" data-i18n="explore"></a></div><div class="hero-art" aria-hidden="true"><span class="art-orbit"></span><span class="art-chair">🪑</span><span class="art-tag">€ 45</span><span class="art-note">NL ↗</span><span class="art-circle"></span></div></section>
<div class="sample-note"><span class="status-dot"></span><span data-i18n="demo"></span></div>
<div id="listing-toolbar" class="listing-toolbar" hidden><button id="listing-create" type="button" class="primary" data-i18n="listingCreate"></button><button id="listing-mine" type="button" class="text-button" data-i18n="listingMine"></button><button id="listing-moderate" type="button" class="text-button" data-i18n="listingModerate" hidden></button><a id="listing-market-link" class="primary" data-i18n="listingOpenMarket" hidden></a></div>
<p id="listing-catalog-error" role="status" data-i18n="listingLoadError" hidden></p><section id="browse"><div class="section-heading"><div><p class="eyebrow" data-i18n="discover"></p><h2 data-i18n="listings"></h2></div><button class="text-button" id="reset" data-i18n="reset"></button></div>
<form id="search-form" class="searchbar" role="search"><label class="search-field"><span aria-hidden="true">⌕</span><span class="sr-only" data-i18n="search"></span><input id="search" type="search" autocomplete="off"></label><button type="submit" class="primary" data-i18n="searchButton"></button></form>
<div id="categories" class="categories" role="group"></div><div class="market-layout"><aside><div class="filter-heading"><h3 data-i18n="filters"></h3><span aria-hidden="true">☷</span></div><label class="filter-label" for="country" data-i18n="country"></label><select id="country"></select><p class="filter-help" data-i18n="countryHelp"></p><label class="check-label"><input type="checkbox" id="nl-only"><span data-i18n="nlOnly"></span></label><hr><span class="filter-label" data-i18n="price"></span><div class="price-fields"><label><span data-i18n="min"></span><input id="min" type="number" min="0" inputmode="decimal" placeholder="€ 0"></label><label><span data-i18n="max"></span><input id="max" type="number" min="0" inputmode="decimal" placeholder="€ ∞"></label></div><label class="filter-label" for="condition" data-i18n="condition"></label><select id="condition"></select></aside>
<div class="results"><div class="results-toolbar"><p id="count" aria-live="polite"></p><label class="sort-label"><span class="sr-only" data-i18n="sort"></span><select id="sort"></select></label></div><div id="grid" class="grid"></div><div id="empty" class="empty" hidden><span aria-hidden="true">⌕</span><h3 data-i18n="empty"></h3><p data-i18n="emptyHelp"></p><button class="primary" id="empty-reset" data-i18n="reset"></button></div></div></div></section>
<section class="feedback-section" aria-labelledby="feedback-heading">
<h2 id="feedback-heading" data-i18n="feedbackTitle"></h2>
<p data-i18n="feedbackIntro"></p>
<form id="feedback-form" action="mailto:ztazegul@yahoo.com" method="get" enctype="text/plain" aria-describedby="feedback-privacy">
<label for="feedback-subject" data-i18n="feedbackSubject"></label>
<input id="feedback-subject" name="subject" type="text" required minlength="3" maxlength="100">
<label for="feedback-body" data-i18n="feedbackBody"></label>
<textarea id="feedback-body" name="body" required minlength="10" maxlength="1500" rows="5"></textarea>
<p id="feedback-privacy" data-i18n="feedbackPrivacy"></p>
<a id="feedback-email" href="mailto:ztazegul@yahoo.com">ztazegul@yahoo.com</a>
<button type="submit" class="primary" data-i18n="feedbackSubmit"></button>
</form></section></main><footer><span>shopping website project · 0.1.0</span><span data-i18n="footer"></span><button id="admin-login" class="text-button" data-i18n="authAdminLogin"></button></footer>
<dialog id="messages-dialog" aria-labelledby="message-heading"><button id="messages-close" type="button" class="text-button" data-i18n="authClose"></button><h2 id="message-heading" data-i18n="messageInbox"></h2><p class="filter-help" data-i18n="messageIntro"></p><button type="button" id="message-refresh" class="text-button" data-i18n="messageRefresh"></button>
<div class="messages-layout"><nav id="message-list"></nav><section class="message-conversation"><p id="message-choose" data-i18n="messageChoose"></p><button type="button" id="message-older" class="text-button" data-i18n="messageOlder" hidden></button><div id="message-history" role="log" aria-live="polite" aria-relevant="additions"></div><p id="message-status" role="status"></p><form id="message-compose" hidden><label for="message-text" data-i18n="messageBody"></label><textarea id="message-text" name="text" required maxlength="2000" rows="3"></textarea><button id="message-send" type="submit" class="primary" data-i18n="messageSend"></button></form></section></div></dialog>
<dialog id="listing-editor" aria-labelledby="listing-editor-title"><button id="listing-editor-close" type="button" class="text-button" data-i18n="authClose"></button><h2 id="listing-editor-title" data-i18n="listingCreate"></h2><p data-i18n="listingLiveNote"></p><p id="listing-edit-help" data-i18n="listingEditHelp" hidden></p><p id="listing-message" role="status"></p>
<form id="listing-form" class="listing-form"><label for="listing-title" data-i18n="listingTitle"></label><input id="listing-title" name="title" required minlength="3" maxlength="120">
<label for="listing-description" data-i18n="listingDescription"></label><textarea id="listing-description" name="description" rows="5" required minlength="20" maxlength="3000"></textarea>
<label for="listing-price" data-i18n="price"></label><input id="listing-price" name="price" type="number" inputmode="decimal" min="0.01" max="999999.99" step="0.01" required>
<label for="listing-kind" data-i18n="listingCategory"></label><select id="listing-kind" name="kind"></select><label for="listing-country" data-i18n="country"></label><select id="listing-country" name="country"></select><p class="filter-help" data-i18n="countryHelp"></p>
<label for="listing-city" data-i18n="listingCity"></label><input id="listing-city" name="city" required minlength="2" maxlength="100">
<label for="listing-condition" data-i18n="condition"></label><select id="listing-condition" name="condition"></select><label for="listing-photos" data-i18n="listingPhotos"></label><input id="listing-photos" name="photos" type="file" accept="image/jpeg,image/png,image/webp" multiple required aria-describedby="listing-photo-help"><p id="listing-photo-help" class="filter-help" data-i18n="listingPhotoHelp"></p>
<button id="listing-submit" type="submit" class="primary" data-i18n="listingSubmit"></button></form></dialog>
<dialog id="listing-manager" aria-labelledby="listing-manager-title"><button id="listing-manager-close" class="text-button" type="button" data-i18n="authClose"></button><h2 id="listing-manager-title" data-i18n="listingMine"></h2><p id="listing-manager-status" role="status"></p><div id="listing-manager-rows"></div></dialog>
<dialog id="auth-dialog" aria-labelledby="auth-heading" aria-describedby="auth-help">
<button type="button" id="auth-close" class="text-button" data-i18n="authClose"></button>
<h2 id="auth-heading" data-i18n="authTitle"></h2><p id="auth-help" data-i18n="authHelp"></p>
<p id="auth-status" role="status"></p>
<form id="auth-email-form"><label for="auth-email" data-i18n="authEmail"></label><input id="auth-email" name="email" type="email" autocomplete="email" required maxlength="254"><button class="primary" type="submit" data-i18n="authSend"></button></form>
<form id="auth-code-form" hidden><label for="auth-code" data-i18n="authCode"></label><input id="auth-code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6,8}" required maxlength="8"><button class="primary" type="submit" data-i18n="authVerify"></button><button type="button" id="auth-change-email" class="text-button" data-i18n="authChange"></button></form>
<div id="auth-session" hidden><p id="auth-user-email"></p><button id="auth-logout" type="button" class="primary" data-i18n="authLogout"></button><section id="auth-admin-panel" hidden><h3 data-i18n="authAdminTitle"></h3><dl><dt data-i18n="authAccounts"></dt><dd id="auth-total"></dd><dt data-i18n="authVerified"></dt><dd id="auth-verified"></dd></dl></section></div>
</dialog><dialog id="detail"><button id="close-detail" class="close-button" aria-label="Close">×</button><div id="detail-content"></div></dialog><script type="module" src="./src/app.js"></script></body></html>
