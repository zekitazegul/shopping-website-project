name: shopping-marketplace
services:
  marketplace:
    build: .
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:4180:4180"
    environment:
      SERVER_CONFIG_PATH: /app/private/server-config.json
    volumes:
      - accounts-data:/app/.server-data
      - private-config:/app/private
      - accounts-backups:/app/backups
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
  https-test:
    profiles: [https-test]
    image: cloudflare/cloudflared@sha256:a15a3b50b8dabd57ac2090e9484c0247dba9dfa1f0df4d298d4317f9d69eb2d5
    command: ["tunnel", "--no-autoupdate", "--url", "http://marketplace:4180", "--http-host-header", "localhost:4180"]
    depends_on:
      marketplace:
        condition: service_healthy
    restart: "no"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
volumes:
  accounts-data:
  private-config:
  accounts-backups:
